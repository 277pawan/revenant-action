name: Revenant Restore Validation
description: Prove PostgreSQL backups restore correctly — run checks locally or restore AWS RDS snapshots in CI. Language-agnostic.
author: 277pawan
branding:
  icon: database
  color: blue

inputs:
  version:
    description: Revenant CLI release tag or "latest"
    required: false
    default: latest
  github-token:
    description: GitHub token used only to access the private Revenant CLI release
    required: false
  config:
    description: Path to revenant.yaml (used by verify, doctor, and private snapshot)
    required: false
    default: revenant.yaml
  command:
    description: Free commands are verify, doctor, init, contract; private mode also supports snapshot, reap, and migrate
    required: false
    default: verify
  args:
    description: Extra flags after the subcommand (e.g. "--max-age 4h --region us-east-1")
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install Revenant
      shell: bash
      env:
        REVENANT_VERSION: ${{ inputs.version }}
        REVENANT_GITHUB_TOKEN: ${{ inputs.github-token }}
      run: bash "${{ github.action_path }}/install.sh"

    - name: Run Revenant
      shell: bash
      env:
        REVENANT_COMMAND: ${{ inputs.command }}
        REVENANT_ARGS: ${{ inputs.args }}
        REVENANT_CONFIG: ${{ inputs.config }}
      run: |
        set -euo pipefail
        BIN="${RUNNER_TEMP}/revenant/revenant"
        read -r -a ARGS <<< "${REVENANT_ARGS:-}"
        case "$REVENANT_COMMAND" in
          verify|doctor)
            exec "$BIN" "$REVENANT_COMMAND" --config "$REVENANT_CONFIG" "${ARGS[@]}"
            ;;
          init|contract)
            exec "$BIN" "$REVENANT_COMMAND" "${ARGS[@]}"
            ;;
          snapshot|reap|migrate)
            if [[ "${REVENANT_CLI_SOURCE:-free}" != "private" ]]; then
              echo "Command '$REVENANT_COMMAND' is only available with the authenticated private CLI." >&2
              exit 1
            fi
            if [[ "$REVENANT_COMMAND" == "snapshot" ]]; then
              exec "$BIN" snapshot --config "$REVENANT_CONFIG" "${ARGS[@]}"
            fi
            exec "$BIN" "$REVENANT_COMMAND" "${ARGS[@]}"
            ;;
          *)
            echo "Unknown Revenant command: $REVENANT_COMMAND" >&2
            exit 1
            ;;
        esac
