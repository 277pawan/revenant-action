name: Revenant Restore Validation
description: Prove PostgreSQL backups restore correctly — run checks locally or restore AWS RDS snapshots in CI. Language-agnostic.
author: 277pawan
branding:
  icon: database
  color: blue

inputs:
  version:
    description: Revenant CLI release tag (e.g. v0.1.1) or "latest"
    required: false
    default: v0.1.1
  repo:
    description: GitHub repo that publishes CLI releases (owner/name)
    required: false
    default: 277pawan/revenant-cli
  config:
    description: Path to revenant.yaml (used by verify)
    required: false
    default: revenant.yaml
  command:
    description: CLI subcommand — verify, init, doctor, reap, or snapshot
    required: false
    default: verify
  args:
    description: Extra flags after the subcommand (e.g. "--max-age 4h --region us-east-1")
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install Revenant
      shell: bash
      env:
        REVENANT_VERSION: ${{ inputs.version }}
        REVENANT_REPO: ${{ inputs.repo }}
      run: bash "${{ github.action_path }}/install.sh"

    - name: Run Revenant
      shell: bash
      run: |
        set -euo pipefail
        CMD="${{ inputs.command }}"
        ARGS="${{ inputs.args }}"
        CONFIG="${{ inputs.config }}"
        BIN="${RUNNER_TEMP}/revenant/revenant"
        case "$CMD" in
          verify)
            exec "$BIN" verify --config "$CONFIG" $ARGS
            ;;
          init|doctor|reap|snapshot|migrate)
            exec "$BIN" "$CMD" $ARGS
            ;;
          *)
            echo "Unknown command: $CMD" >&2
            exit 1
            ;;
        esac
