name: Revenant
description: Download a Revenant release binary and run verify, init, reap, or snapshot.
branding:
  icon: database
  color: blue

inputs:
  version:
    description: Revenant CLI release tag to install (e.g. v0.1.0) or "latest"
    required: false
    default: v0.1.0
  repo:
    description: GitHub repo that publishes releases (owner/name)
    required: false
    default: 277pawan/revenant-cli
  config:
    description: Path to revenant.yaml (for verify command)
    required: false
    default: revenant.yaml
  command:
    description: revenant subcommand — verify, init, reap, snapshot
    required: false
    default: verify
  args:
    description: Extra CLI flags after the subcommand (e.g. "--max-age 4h --region us-east-1")
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install Revenant
      shell: bash
      env:
        REVENANT_VERSION: ${{ inputs.version }}
        REVENANT_REPO: ${{ inputs.repo }}
      run: bash "${{ github.action_path }}/install.sh"

    - name: Run Revenant
      shell: bash
      run: |
        set -euo pipefail
        CMD="${{ inputs.command }}"
        ARGS="${{ inputs.args }}"
        CONFIG="${{ inputs.config }}"
        BIN="${RUNNER_TEMP}/revenant/revenant"
        case "$CMD" in
          verify)
            exec "$BIN" verify --config "$CONFIG" $ARGS
            ;;
          init)
            exec "$BIN" init $ARGS
            ;;
          reap|snapshot|migrate)
            exec "$BIN" "$CMD" $ARGS
            ;;
          *)
            echo "Unknown command: $CMD" >&2
            exit 1
            ;;
        esac
